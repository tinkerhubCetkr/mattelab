<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Makerspace Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background: white;

            width: 90%;
            max-width: 500px;

            padding: 35px;

            border-radius: 14px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .dashboard h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .dashboard p {
            margin: 8px 0;
            color: #666;
        }

        #userEmail {
            font-size: 14px;
        }

        #logout {
            margin-top: 25px;

            padding: 10px 22px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }

        #logout:hover {
            opacity: 0.85;
        }

    </style>

</head>


<body>

    <div class="dashboard">

        <h1>Makerspace</h1>

        <p id="userName">
            Loading...
        </p>

        <p id="userEmail"></p>

        <button id="logout">
            Sign Out
        </button>

    </div>


    <script type="module">

        import { auth }
        from "./firebase.js";

        import {
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


        const userName =
            document.getElementById("userName");

        const userEmail =
            document.getElementById("userEmail");


        onAuthStateChanged(auth, (user) => {

            console.log("Auth state:", user);

            if (user) {

                userName.textContent =
                    `Welcome, ${user.displayName}`;

                userEmail.textContent =
                    user.email;

            }

            else {

                window.location.href =
                    "index.html";

            }

        });


        document
            .getElementById("logout")
            .addEventListener("click", async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                }

                catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            });

    </script>

</body>

</html>
